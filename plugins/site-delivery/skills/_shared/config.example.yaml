# Site delivery configuration examples
#
# This plugin's settings live in the `site-delivery` section of
# .vf-founder-kit/config.yaml in your repository root. Pick ONE example below,
# copy its `site-delivery` section into that file, and customize it for your
# project. The file is shared by every Founder Kit plugin, so other plugins'
# sections (agent-delivery, customer-research, ...) may sit in the same file —
# leave them as they are.
#
# The tracker and the release steps are NOT part of the site-delivery section.
# They are the shared top-level `tracker` and `release` keys, which core reads
# too (and agent-delivery reads `tracker`). If core's fk-setup already wrote
# them, keep them as they are.
#
# Delivery never deploys. When you're ready, run /core:fk-release (if you have
# the core plugin) or follow docs/DEPLOYMENT.md.

# ============================================================================
# EXAMPLE 1: Thin path (default) — no tracker, no stages
# ============================================================================
# For smart non-coding founders who want to hand Claude a brief
# and get back a PR, without setting up GitHub Projects or Linear.

release:                        # shared top-level key, not inside site-delivery
  branch: main
  targets:
    - kind: lovable
      project_id: <lovable-project-id>   # optional, for the report only

site-delivery:
  schema_version: 1

  repo:
    url: https://github.com/Vibing-Founders/my-marketing-site
    main_branch: main
    branch_prefix: feature/

  # No tracker key needed: the thin path makes no tracker calls.

  stages:
    enabled: false  # Thin path — no compound-engineering stages

  delivery_rules:
    human_merge_gate: true
    human_publish_gate: true
    confirm_live: true
    experimental_changes: false

  agent_delivery_integration:
    enabled: false  # Not wired in v0.0.1

---

# ============================================================================
# EXAMPLE 2: GitHub board with fuller stages
# ============================================================================
# For teams using GitHub Projects to track site work and wanting
# compound-engineering brainstorm/plan/work/review stages.

tracker:                        # shared top-level key, not inside site-delivery
  kind: github                  # github-project is still read as github
  board:
    project: Widget Co Site Delivery  # Anonymized project name
    field: Status
  stage_map:                    # canonical stage -> column on the board
    brainstormed: Brainstormed
    planned: Planned
    in_progress: In Progress
    human_review: Review
    for_release: Ready to Publish
    done: Live

release:                        # shared top-level key, not inside site-delivery
  branch: main
  targets:
    - kind: command
      name: Deploy site
      run: AWS_PROFILE=<aws-profile> npx sst deploy --stage production

site-delivery:
  schema_version: 1

  repo:
    url: https://github.com/Widget-Co/company-site  # Anonymized example
    main_branch: main
    branch_prefix: feature/

  stages:
    enabled: true  # Enable compound-engineering stages
    artifact_glob: docs/plans/*.md
    readiness_key: artifact_readiness
    map:
      requirements-only: plan
      implementation-ready: work
    skills:
      brainstorm: compound-engineering:ce-brainstorm
      plan: compound-engineering:ce-plan
      work: compound-engineering:ce-work
      review: compound-engineering:ce-review

  delivery_rules:
    human_merge_gate: true
    human_publish_gate: true
    confirm_live: true
    experimental_changes: false

  agent_delivery_integration:
    enabled: false

---

# ============================================================================
# EXAMPLE 3: Linear tracker with fuller stages
# ============================================================================
# For teams using Linear to track site delivery work.

tracker:                        # shared top-level key, not inside site-delivery
  kind: linear
  stage_map:                    # canonical stage -> workflow state
    brainstormed: Brainstormed
    planned: Planned
    in_progress: In Progress
    human_review: In Review
    done: Done

release:                        # shared top-level key, not inside site-delivery
  branch: main
  targets:                      # run in this order: backend before frontend
    - kind: supabase-migrations
      project_ref: <project-ref>
      cli: npx supabase
    - kind: supabase-functions
      project_ref: <project-ref>
      cli: npx supabase
    - kind: lovable
      project_id: <lovable-project-id>

site-delivery:
  schema_version: 1

  repo:
    url: https://github.com/Acme/acme-site  # Anonymized example
    main_branch: main
    branch_prefix: feature/

  stages:
    enabled: true
    artifact_glob: docs/plans/*.md
    readiness_key: artifact_readiness
    map:
      requirements-only: plan
      implementation-ready: work
    skills:
      brainstorm: compound-engineering:ce-brainstorm
      plan: compound-engineering:ce-plan
      work: compound-engineering:ce-work
      review: compound-engineering:ce-review

  delivery_rules:
    human_merge_gate: true
    human_publish_gate: true
    confirm_live: true
    experimental_changes: false

  agent_delivery_integration:
    enabled: false

---

# ============================================================================
# NOTES ON THE RELEASE KEY
# ============================================================================
#
# All examples above use placeholder values. In your own config:
#
# - lovable: project_id is optional and only shown in reports
# - supabase-migrations / supabase-functions: set project_ref to your Supabase
#   project reference; migrations always come before functions
# - command: any deploy command, such as `npx sst deploy --stage production`
# - manual: a step only a person can do, with `say: <what to do>`
#
# These five kinds are all v1 supports. The site-delivery plugin never deploys.
# Run /core:fk-release (if you have the core plugin) or follow
# docs/DEPLOYMENT.md.
#
# Upgrading from site-delivery 0.x? A `publish` block inside the site-delivery
# section is read and mapped to `release`; /site-delivery:fk-onboard or
# /core:fk-setup moves it when you confirm.
