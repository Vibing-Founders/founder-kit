# Site delivery configuration examples
#
# This plugin's settings live in the `site-delivery` section of
# .vf-founder-kit/config.yaml in your repository root. Pick ONE example below,
# copy its `site-delivery` section into that file, and customize it for your
# project. The file is shared by every Founder Kit plugin, so other plugins'
# sections (agent-delivery, customer-research, ...) may sit in the same file —
# leave them as they are.
#
# The tracker is NOT part of the site-delivery section. It is the shared
# top-level `tracker` key, which core and agent-delivery read too. Examples 2
# and 3 show it. If core's fk-setup already wrote it, keep it as it is.

# ============================================================================
# EXAMPLE 1: Thin path (default) — no tracker, no stages
# ============================================================================
# For smart non-coding founders who want to hand Claude a brief
# and get back a PR, without setting up GitHub Projects or Linear.

site-delivery:
  schema_version: 1

  repo:
    url: https://github.com/Vibing-Founders/my-marketing-site
    main_branch: main
    branch_prefix: feature/

  # No tracker key needed: the thin path makes no tracker calls.

  publish:
    kind: lovable
    project_id: ""  # Your Lovable project ID here

  stages:
    enabled: false  # Thin path — no compound-engineering stages

  delivery_rules:
    human_merge_gate: true
    human_publish_gate: true
    confirm_live: true
    experimental_changes: false

  agent_delivery_integration:
    enabled: false  # Not wired in v0.0.1

---

# ============================================================================
# EXAMPLE 2: GitHub board with fuller stages
# ============================================================================
# For teams using GitHub Projects to track site work and wanting
# compound-engineering brainstorm/plan/work/review stages.

tracker:                        # shared top-level key, not inside site-delivery
  kind: github                  # github-project is still read as github
  board:
    project: Widget Co Site Delivery  # Anonymized project name
    field: Status
  stage_map:                    # canonical stage -> column on the board
    brainstormed: Brainstormed
    planned: Planned
    in_progress: In Progress
    human_review: Review
    for_release: Ready to Publish
    done: Live

site-delivery:
  schema_version: 1

  repo:
    url: https://github.com/Widget-Co/company-site  # Anonymized example
    main_branch: main
    branch_prefix: feature/

  publish:
    kind: sst-web
    stage: production
    aws_profile: ""  # Your AWS profile name

  stages:
    enabled: true  # Enable compound-engineering stages
    artifact_glob: docs/plans/*.md
    readiness_key: artifact_readiness
    map:
      requirements-only: plan
      implementation-ready: work
    skills:
      brainstorm: compound-engineering:ce-brainstorm
      plan: compound-engineering:ce-plan
      work: compound-engineering:ce-work
      review: compound-engineering:ce-review

  delivery_rules:
    human_merge_gate: true
    human_publish_gate: true
    confirm_live: true
    experimental_changes: false

  agent_delivery_integration:
    enabled: false

---

# ============================================================================
# EXAMPLE 3: Linear tracker with fuller stages
# ============================================================================
# For teams using Linear to track site delivery work.

tracker:                        # shared top-level key, not inside site-delivery
  kind: linear
  stage_map:                    # canonical stage -> workflow state
    brainstormed: Brainstormed
    planned: Planned
    in_progress: In Progress
    human_review: In Review
    done: Done

site-delivery:
  schema_version: 1

  repo:
    url: https://github.com/Acme/acme-site  # Anonymized example
    main_branch: main
    branch_prefix: feature/

  publish:
    kind: supabase+lovable
    supabase_project_ref: ""  # Your Supabase project reference
    lovable_project_id: ""    # Your Lovable project ID

  stages:
    enabled: true
    artifact_glob: docs/plans/*.md
    readiness_key: artifact_readiness
    map:
      requirements-only: plan
      implementation-ready: work
    skills:
      brainstorm: compound-engineering:ce-brainstorm
      plan: compound-engineering:ce-plan
      work: compound-engineering:ce-work
      review: compound-engineering:ce-review

  delivery_rules:
    human_merge_gate: true
    human_publish_gate: true
    confirm_live: true
    experimental_changes: false

  agent_delivery_integration:
    enabled: false

---

# ============================================================================
# NOTES ON PUBLISH KINDS
# ============================================================================
#
# All examples above use anonymized stub values. In your own config:
#
# - lovable: Set project_id to your Lovable project identifier
# - sst-web: Set stage (e.g. production, staging) and aws_profile
# - supabase+lovable: Set both supabase_project_ref and lovable_project_id
#
# The fk-orchestrate skill will report which publish kind is configured
# and state that the human runs the locked publish path. No deployments
# are triggered by the plugin in v0.0.1.
